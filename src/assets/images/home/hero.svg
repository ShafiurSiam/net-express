    <line x1="450" y1="360" x2="640" y2="180"/>
    <line x1="450" y1="360" x2="700" y2="420"/>
    <line x1="450" y1="360" x2="560" y2="580"/>
    <line x1="450" y1="360" x2="290" y2="560"/>
