<svg width="900" height="820" viewBox="0 0 900 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="নেটওয়ার্ক সংযোগের বিমূর্ত চিত্র">
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#C8102E" stop-opacity="0.35"/>
