    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8102E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C8102E" stop-opacity="0.05"/>
